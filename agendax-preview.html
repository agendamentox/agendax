function navigate(hash){location.hash=hash;}
window.addEventListener('hashchange',route);
window.addEventListener('DOMContentLoaded',()=>{route();if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}});

function route(){
  const h=location.hash||'#home';
  if(h.startsWith('#booking')) return renderBooking();
  if(h==='#login') return renderLogin();
  if(h==='#owner') return renderOwner();
  if(h==='#onboarding') return renderOnboarding();
  if(h.startsWith('#app')) return renderDashboard(h.split('/')[1]||'inicio');
  renderHome();
}

function shell(active,content,title='Visão geral'){
 return `<div class="appShell"><aside class="sidebar"><div class="sideBrand"><div class="brand"><span class="brandmark">AX</span><span>AgendaX</span></div></div><div class="businessMini"><div class="businessLogo">${state.business.logo||'AX'}</div><div><div class="bold small">${state.business.name}</div><div class="tiny muted">${state.plan}</div></div></div><nav class="menu">${menuItems.map(([id,ic,l])=>`<button class="${active===id?'active':''}" onclick="navigate('#app/${id}')"><b>${icon(ic)}</b><span>${l}</span></button>`).join('')}<div class="sep"></div><button onclick="navigate('#booking/${state.business.slug}')"><b>${icon('link')}</b><span>Ver página pública</span></button><button onclick="navigate('#home')"><b>←</b><span>Sair</span></button></nav></aside><section class="content"><header class="topbar"><div><div class="topTitle">${title}</div><div class="tiny muted">${state.business.name}</div></div><div class="topActions"><span class="statusDot"></span><span class="tiny muted">Sistema online</span><button class="btn btn-ghost btn-sm" style="color:#344054;border-color:#dfe5ee" onclick="shareBookingLink()">Compartilhar</button><button class="btn btn-dark btn-sm" onclick="openQuickBooking()">+ Novo agendamento</button></div></header><main class="main">${content}</main></section></div>`;
}
function renderDashboard(page){
 const renderers={inicio:dashHome,agenda:dashAgenda,servicos:dashServices,clientes:dashClients,equipe:dashTeam,produtos:dashProducts,financeiro:dashFinance,relatorios:dashReports,aparencia:dashAppearance,integracoes:dashIntegrations,config:dashConfig};
 app().innerHTML=shell(page,(renderers[page]||dashHome)(),menuItems.find(x=>x[0]===page)?.[2]||'Visão geral');
}
function dashHome(){
 const todays=state.bookings.filter(b=>b.date===todayISO());
 const revenue=state.sales.reduce((a,b)=>a+Number(b.value),0)+todays.filter(b=>b.status!=='cancelado').reduce((a,b)=>a+Number(b.price||0),0);
 const avg=todays.length?revenue/todays.length:0;
 return `<div class="pageHead"><div><h1>Boa tarde 👋</h1><p>Veja como está o movimento do seu negócio hoje.</p></div><button class="btn btn-primary" onclick="navigate('#booking/${state.business.slug}')">Abrir minha página</button></div>
 <div class="cards"><div class="metric"><div class="label">Agendamentos hoje</div><div class="value">${todays.length}</div><div class="trend">↑ agenda ativa</div></div><div class="metric"><div class="label">Faturamento estimado</div><div class="value">${money(revenue)}</div><div class="trend">serviços + vendas</div></div><div class="metric"><div class="label">Clientes cadastrados</div><div class="value">${state.clients.length}</div><div class="trend">base própria</div></div><div class="metric"><div class="label">Ticket médio</div><div class="value">${money(avg)}</div><div class="trend">hoje</div></div></div>
 <div class="grid2"><div class="panel"><div class="panelHead"><h3>Agenda de hoje</h3><button class="btn btn-sm btn-ghost" style="color:#344054;border-color:#e3e8ef" onclick="navigate('#app/agenda')">Ver agenda</button></div>${todays.length?todays.sort((a,b)=>a.time.localeCompare(b.time)).map(bookingRow).join(''):'<div class="empty">Nenhum agendamento para hoje.</div>'}</div>
 <div class="panel"><div class="panelHead"><h3>Ações rápidas</h3></div><div class="quickGrid"><button class="quick" onclick="openQuickBooking()">＋<b>Novo horário</b><span>Agendar cliente</span></button><button class="quick" onclick="openServiceModal()">✂<b>Novo serviço</b><span>Preço e duração</span></button><button class="quick" onclick="navigate('#app/clientes')">♙<b>Clientes</b><span>Ver histórico</span></button><button class="quick" onclick="navigate('#app/financeiro')">◫<b>Financeiro</b><span>Ver faturamento</span></button><button class="quick" onclick="navigate('#app/relatorios')">⌁<b>Relatórios</b><span>Desempenho do negócio</span></button><button class="quick" onclick="shareBookingLink()">↗<b>Compartilhar link</b><span>Enviar página de agendamento</span></button></div></div></div>
 <div class="grid2"><div class="panel"><div class="panelHead"><h3>Movimento da semana</h3><span class="tiny muted">Agendamentos</span></div><div class="chartBars">${[35,58,45,75,62,92,28].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${['S','T','Q','Q','S','S','D'][i]}</span></div>`).join('')}</div></div><div class="panel"><div class="panelHead"><h3>Seu plano</h3></div><span class="badge" style="color:#765800">${state.plan}</span><div style="font-family:Manrope;font-size:28px;font-weight:800;margin:14px 0">${state.plan==='Básico'?'R$ 19,90':'R$ 39,90'}<span class="tiny muted">/mês</span></div><p class="small muted">${state.plan==='Básico'?'Agenda, página pública, clientes e financeiro simples.':'Inclui equipe, comissão, produtos e relatórios avançados.'}</p><button class="btn btn-dark btn-sm" onclick="upgradePlan()">${state.plan==='Básico'?'Conhecer Pro':'Plano ativo'}</button></div></div>`;
}
function bookingRow(b){return `<div class="appointment"><div class="time">${b.time}</div><div><div class="client">${b.client}</div><div class="service">${b.service} · ${b.professional}</div></div><span class="tag ${b.status==='pendente'?'warn':b.status==='cancelado'?'gray':''}">${b.status}</span></div>`}
function dashAgenda(){
 const dates=[...new Set(state.bookings.map(b=>b.date))].sort();
 return `<div class="pageHead"><div><h1>Agenda</h1><p>Controle horários, confirmações, faltas e encaixes.</p></div><button class="btn btn-primary" onclick="openQuickBooking()">+ Novo agendamento</button></div>
 <div class="panel"><div class="kpiRow"><span class="pill">Hoje: ${state.bookings.filter(b=>b.date===todayISO()).length}</span><span class="pill">Confirmados: ${state.bookings.filter(b=>b.status==='confirmado').length}</span><span class="pill">Pendentes: ${state.bookings.filter(b=>b.status==='pendente').length}</span></div>
 ${dates.length?dates.map(d=>`<div style="margin-top:18px"><div class="bold" style="margin-bottom:7px">${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div>${state.bookings.filter(b=>b.date===d).sort((a,b)=>a.time.localeCompare(b.time)).map(b=>`<div class="appointment"><div class="time">${b.time}</div><div><div class="client">${b.client}</div><div class="service">${b.service} · ${b.professional} · ${money(b.price)}</div></div><div class="actions"><button class="iconBtn" onclick="setBookingStatus('${b.id}','confirmado')">✓</button><button class="iconBtn" onclick="setBookingStatus('${b.id}','faltou')">F</button><button class="iconBtn" onclick="deleteBooking('${b.id}')">×</button></div></div>`).join('')}</div>`).join(''):'<div class="empty">Sua agenda está vazia.</div>'}</div>`;
}

function dashReports(){const totalBookings=state.bookings.length, confirmed=state.bookings.filter(b=>b.status==='confirmado').length, noShow=state.bookings.filter(b=>b.status==='faltou').length;const revenue=state.sales.reduce((a,b)=>a+Number(b.value||0),0)+state.bookings.filter(b=>b.status!=='cancelado').reduce((a,b)=>a+Number(b.price||0),0);const serviceMap={};state.bookings.forEach(b=>serviceMap[b.service]=(serviceMap[b.service]||0)+1);const bestServices=Object.entries(serviceMap).sort((a,b)=>b[1]-a[1]).slice(0,5);const profMap={};state.bookings.forEach(b=>profMap[b.professional]=(profMap[b.professional]||0)+Number(b.price||0));const bestPros=Object.entries(profMap).sort((a,b)=>b[1]-a[1]).slice(0,5);const rate=totalBookings?Math.round(confirmed/totalBookings*100):0;return `<div class="pageHead"><div><h1>Relatórios</h1><p>Indicadores simples para entender o que está funcionando.</p></div><button class="btn btn-ghost" style="color:#344054;border-color:#dfe5ee" onclick="exportReportCSV()">Exportar relatório</button></div><div class="cards"><div class="metric"><div class="label">Faturamento registrado</div><div class="value">${money(revenue)}</div></div><div class="metric"><div class="label">Taxa de confirmação</div><div class="value">${rate}%</div></div><div class="metric"><div class="label">Faltas</div><div class="value">${noShow}</div></div><div class="metric"><div class="label">Agendamentos</div><div class="value">${totalBookings}</div></div></div><div class="grid2"><div class="panel"><div class="panelHead"><h3>Serviços mais agendados</h3></div>${bestServices.map(([n,v],i)=>`<div class="rankRow"><div><b>${i+1}. ${n}</b><div class="progress" style="margin-top:7px"><i style="width:${Math.min(100,v/Math.max(1,totalBookings)*100)}%"></i></div></div><span class="chip">${v} agend.</span></div>`).join('')||'<div class="empty">Sem dados ainda.</div>'}</div><div class="panel"><div class="panelHead"><h3>Receita por profissional</h3></div>${bestPros.map(([n,v],i)=>`<div class="rankRow"><b>${i+1}. ${n}</b><span class="chip pro">${money(v)}</span></div>`).join('')||'<div class="empty">Sem dados ainda.</div>'}</div></div>`}
function dashProducts(){return `<div class="pageHead"><div><h1>Produtos</h1><p>Venda de balcão e controle simples de estoque.</p></div><button class="btn btn-primary" onclick="openProductModal()">+ Produto</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Produto</th><th>Preço</th><th>Estoque</th><th></th></tr></thead><tbody>${state.products.map(p=>`<tr><td><b>${p.name}</b></td><td>${money(p.price)}</td><td>${p.stock} un.</td><td><button class="iconBtn" onclick="sellProduct('${p.id}')">Registrar venda</button></td></tr>`).join('')}</tbody></table></div>`}

 const serviceRevenue=state.bookings.filter(b=>b.status!=='cancelado').reduce((a,b)=>a+Number(b.price||0),0), salesRevenue=state.sales.reduce((a,b)=>a+Number(b.value),0), total=serviceRevenue+salesRevenue;

ness.cancellationHours===24?'selected':''}>24 horas</option></select></div><div class="field"><label>Agenda aberta por</label><select onchange="state.business.bookingWindowDays=Number(this.value);save();toast('Regra salva')"><option value="15" ${state.business.bookingWindowDays===15?'selected':''}>15 dias</option><option value="30" ${state.business.bookingWindowDays===30?'selected':''}>30 dias</option><option value="60" ${state.business.bookingWindowDays===60?'selected':''}>60 dias</option></select></div><div class="field"><label>Intervalo entre clientes</label><select onchange="state.business.interval=Number(this.value);save();toast('Regra salva')"><option value="0" ${state.business.interval===0?'selected':''}>Sem intervalo</option><option value="10" ${state.business.interval===10?'selected':''}>10 min</option><option value="15" ${state.business.interval===15?'selected':''}>15 min</option><option value="30" ${state.business.interval===30?'selected':''}>30 min</option></select></div></div></div><div class="panel"><h3>Expediente</h3>${Object.entries(state.business.hours).map(([day,h])=>`<div class="switchRow"><span class="small bold">${day}</span><span class="small muted">${h[0]&&h[1]?h[0]+' — '+h[1]:'Fechado'}</span></div>`).join('')}<div class="notice" style="margin-top:16px"><div class="health"><span class="healthDot"></span><div><b>Dados salvos neste navegador</b><div class="small muted">Nesta demo estática, os dados ficam em localStorage. Para produção multiusuário, conecte um banco de dados.</div></div></div></div></div></div><div class="dangerZone"><b>Restaurar demonstração</b><p class="small muted">Apaga os dados locais deste navegador e volta ao conteúdo inicial.</p><button class="btn btn-danger btn-sm" onclick="resetDemo()">Restaurar dados</button></div>`}

function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function modal(html){const b=document.createElement('div');b.className='modalBackdrop';b.id='modal';b.innerHTML=`<div class="modal">${html}</div>`;b.addEventListener('click',e=>{if(e.target===b)b.remove()});document.body.appendChild(b)}
function closeModal(){$('#modal')?.remove()}
function openQuickBooking(){modal(`<div class="modalHead"><h3>Novo agendamento</h3><button class="iconBtn" onclick="closeModal()">×</button></div><form onsubmit="saveQuickBooking(event)"><div class="fieldGrid"><div class="field"><label>Cliente</label><input id="qbClient" required></div><div class="field"><label>WhatsApp</label><input id="qbPhone" required></div><div class="field"><label>Serviço</label><select id="qbService">${state.services.filter(s=>s.active).map(s=>`<option value="${s.id}">${s.name} — ${money(s.price)}</option>`).join('')}</select></div><div class="field"><label>Profissional</label><select id="qbProf">${state.professionals.filter(p=>p.active).map(p=>`<option>${p.name}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="qbDate" type="date" value="${todayISO()}" required></div><div class="field"><label>Hora</label><input id="qbTime" type="time" value="15:00" required></div></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Salvar agendamento</button></form>`)}

function openServiceModal(){modal(`<div class="modalHead"><h3>Novo serviço</h3><button class="iconBtn" onclick="closeModal()">×</button></div><form onsubmit="saveService(event)"><div class="fieldGrid"><div class="field full"><label>Nome</label><input id="svName" required placeholder="Ex.: Corte masculino"></div><div class="field"><label>Duração (min)</label><input id="svDuration" type="number" value="30" required></div><div class="field"><label>Preço</label><input id="svPrice" type="number" step="0.01" value="30" required></div></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Adicionar serviço</button></form>`)}
function saveService(e){e.preventDefault();state.services.push({id:uid(),name:$('#svName').value,duration:+$('#svDuration').value,price:+$('#svPrice').value,active:true});save();closeModal();toast('Serviço adicionado');route()}

function openClientModal(){modal(`<div class="modalHead"><h3>Novo cliente</h3><button class="iconBtn" onclick="closeModal()">×</button></div><form onsubmit="saveClient(event)"><div class="fieldGrid"><div class="field full"><label>Nome</label><input id="clName" required></div><div class="field full"><label>WhatsApp</label><input id="clPhone" required placeholder="21999999999"></div></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Cadastrar cliente</button></form>`)}

function openProfessionalModal(){modal(`<div class="modalHead"><h3>Novo profissional</h3><button class="iconBtn" onclick="closeModal()">×</button></div><form onsubmit="saveProfessional(event)"><div class="fieldGrid"><div class="field full"><label>Nome</label><input id="pfName" required></div><div class="field"><label>Função</label><input id="pfRole" required placeholder="Ex.: Barbeiro"></div><div class="field"><label>Comissão (%)</label><input id="pfCommission" type="number" min="0" max="100" value="40" required></div></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Adicionar profissional</button></form>`)}
function saveProfessional(e){e.preventDefault();state.professionals.push({id:uid(),name:$('#pfName').value,role:$('#pfRole').value,commission:Number($('#pfCommission').value),active:true});save();closeModal();toast('Profissional adicionado');route()}

function downloadFile(name,content,type='text/plain'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvEscape(v){return `"${String(v??'').replaceAll('"','""')}"`}
function exportClientsCSV(){const rows=[['Nome','WhatsApp','Visitas','Total gasto','Ultima visita'],...state.clients.map(c=>[c.name,c.phone,c.visits,c.total,c.last])];downloadFile('agendax-clientes.csv','\ufeff'+rows.map(r=>r.map(csvEscape).join(';')).join('\n'),'text/csv;charset=utf-8')}
function exportReportCSV(){const rows=[['Tipo','Descricao','Valor/Data'],...state.sales.map(v=>['Venda',v.description,v.value]),...state.bookings.map(b=>['Agendamento',b.client+' - '+b.service,b.date+' '+b.time])];downloadFile('agendax-relatorio.csv','\ufeff'+rows.map(r=>r.map(csvEscape).join(';')).join('\n'),'text/csv;charset=utf-8')}
function exportBackup(){downloadFile('agendax-backup.json',JSON.stringify(state,null,2),'application/json')}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.business||!data.services)throw Error();state=data;save();toast('Backup importado');setTimeout(()=>route(),300)}catch{toast('Arquivo de backup inválido')}};r.readAsText(file)}
function resetDemo(){if(!confirm('Restaurar todos os dados da demonstração?'))return;localStorage.removeItem(storeKey);state=structuredClone(defaults);save();toast('Demonstração restaurada');route()}
function shareBookingLink(){const url=location.origin+location.pathname+'#booking/'+state.business.slug;if(navigator.share){navigator.share({title:state.business.name,text:'Agende seu horário',url}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>toast('Link de agendamento copiado'))}else{prompt('Copie o link:',url)}}
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});function installPWA(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>deferredInstallPrompt=null)}else{toast('No celular, use o menu do navegador e toque em “Instalar app” ou “Adicionar à tela inicial”.')}}
function openProductModal(){modal(`<div class="modalHead"><h3>Novo produto</h3><button class="iconBtn" onclick="closeModal()">×</button></div><form onsubmit="saveProduct(event)"><div class="fieldGrid"><div class="field full"><label>Produto</label><input id="pdName" required></div><div class="field"><label>Preço</label><input id="pdPrice" type="number" step="0.01" required></div><div class="field"><label>Estoque</label><input id="pdStock" type="number" value="1" required></div></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Adicionar</button></form>`)}
function saveProduct(e){e.preventDefault();state.products.push({id:uid(),name:$('#pdName').value,price:+$('#pdPrice').value,stock:+$('#pdStock').value});save();closeModal();toast('Produto adicionado');route()}
function sellProduct(id){const p=state.products.find(x=>x.id===id);if(p.stock<=0)return toast('Produto sem estoque');p.stock--;state.sales.push({id:uid(),date:todayISO(),type:'produto',description:p.name,value:p.price});save();toast('Venda registrada');route()}
function openSaleModal(){modal(`<div class="modalHead"><h3>Novo lançamento</h3><button class="iconBtn" onclick="closeModal()">×</button></div><form onsubmit="saveSale(event)"><div class="fieldGrid"><div class="field full"><label>Descrição</label><input id="saleDesc" required></div><div class="field"><label>Tipo</label><select id="saleType"><option>produto</option><option>serviço</option><option>outro</option></select></div><div class="field"><label>Valor</label><input id="saleValue" type="number" step="0.01" required></div></div><button class="btn btn-primary" style="width:100%;margin-top:18px">Lançar</button></form>`)}
function saveSale(e){e.preventDefault();state.sales.push({id:uid(),date:todayISO(),type:$('#saleType').value,description:$('#saleDesc').value,value:+$('#saleValue').value});save();closeModal();toast('Lançamento salvo');route()}
function setBookingStatus(id,status){state.bookings.find(b=>b.id===id).status=status;save();toast('Status atualizado');route()}function deleteBooking(id){state.bookings=state.bookings.filter(b=>b.id!==id);save();route()}
function openWhats(phone){window.open(`https://wa.me/55${phone.replace(/\D/g,'')}`,'_blank')}
function saveAppearance(){state.business.name=$('#bizName').value;state.business.niche=$('#bizNiche').value;state.business.whatsapp=$('#bizWhats').value;state.business.address=$('#bizAddress').value;state.business.bio=$('#bizBio').value;state.business.brand=$('#bizColor').value;state.business.cover=$('#bizCover').value;document.documentElement.style.setProperty('--brand',state.business.brand);save();toast('Página atualizada');route()}
function toggleNotif(el){state.business.notifications=!state.business.notifications;el.classList.toggle('on');if(state.business.notifications&&'Notification'in window)Notification.requestPermission();save()}
function openGoogleConnect(){const connected=!!state.business.googleCalendar;modal(`<div class="modalHead"><div><h3 style="margin:0">${connected?'Google Agenda conectado':'Conectar Google Agenda'}</h3><div class="small muted" style="margin-top:4px">Leva menos de um minuto para o assinante.</div></div><button class="iconBtn" onclick="closeModal()">×</button></div><div class="oauthModal">${connected?`<div class="successBox"><b>Conta conectada na demonstração.</b><div class="small" style="margin-top:4px">Na versão de produção, aqui aparecerão o e-mail Google e o calendário selecionado.</div></div>`:`<div class="oauthStep"><div class="stepNumber">1</div><div><b>Entre com o Google</b><div class="small muted">O Google abre a tela oficial de login/autorização.</div></div></div><div class="oauthStep"><div class="stepNumber">2</div><div><b>Permita acesso ao Agenda</b><div class="small muted">O AgendaX solicita apenas as permissões necessárias para sincronizar compromissos.</div></div></div><div class="oauthStep"><div class="stepNumber">3</div><div><b>Volte para o painel</b><div class="small muted">A conexão fica salva e os agendamentos podem ser sincronizados.</div></div></div><div class="helpNote"><b>Importante:</b> nesta prévia HTML o botão abaixo simula a conclusão. Na versão online ele deve apontar para a rota OAuth do backend.</div>`}<button class="btn btn-primary" style="width:100%" onclick="${connected?'closeModal()':'completeGoogleDemo()'}">${connected?'Fechar':'Continuar com Google'}</button></div>`)}
function completeGoogleDemo(){state.business.googleCalendar=true;save();closeModal();toast('Google Agenda conectado na demonstração');route()}
function disconnectGoogle(){state.business.googleCalendar=false;save();toast('Google Agenda desconectado');route()}
function toggleGoogle(){openGoogleConnect()}
function toggleDeposit(el){state.business.requireDeposit=!state.business.requireDeposit;el.classList.toggle('on');save()}
function copyPublicLink(){navigator.clipboard?.writeText(`${location.origin}${location.pathname}#booking/${state.business.slug}`);toast('Link copiado')}
function upgradePlan(){state.plan=state.plan==='Básico'?'Pro':'Básico';save();toast(`Plano alterado para ${state.plan} na demonstração`);route()}

function renderBooking(){
 const business=state.business,activeServices=state.services.filter(s=>s.active),profs=state.professionals.filter(p=>p.active);
 window.bookFlow={step:1,service:null,prof:null,date:null,time:null};
 const cover=business.cover?`background-image:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.67)),url('${business.cover}')`:'';
 app().innerHTML=`<div class="bookingPage"><div class="bookingHero" style="${cover}"><div class="container bookingTop"><div class="brand"><span class="brandmark" style="background:${business.brand}">${business.logo}</span>${business.name}</div><button class="btn btn-ghost btn-sm" onclick="navigate('#home')">Powered by AgendaX</button></div><div class="bookingIntro"><div class="eyebrow" style="color:#fff;opacity:.78">${business.niche}</div><h1>${business.name}</h1><div>${business.bio}</div></div></div><div class="bookingWrap"><div class="bookCard"><div class="steps"><i class="step active"></i><i class="step"></i><i class="step"></i><i class="step"></i></div><div id="bookingFlow"></div></div><aside class="bookCard bookingSummary"><h3 style="margin-top:0">Seu agendamento</h3><div id="bookSummary"><div class="empty">Escolha um serviço para começar.</div></div><div style="margin-top:18px" class="small muted">📍 ${business.address}</div><div style="margin-top:8px" class="small muted">WhatsApp: ${business.whatsapp}</div></aside></div></div>`;
 renderBookStep(activeServices,profs);
}
function renderBookStep(services=state.services.filter(s=>s.active),profs=state.professionals.filter(p=>p.active)){
 const f=window.bookFlow,root=$('#bookingFlow');$$('.step').forEach((s,i)=>s.classList.toggle('active',i<f.step));
 if(f.step===1) root.innerHTML=`<div class="eyebrow" style="color:#785f00">Passo 1</div><h2 style="margin:8px 0 18px">Qual serviço você quer?</h2><div class="choiceGrid">${services.map(s=>`<button class="choice ${f.service?.id===s.id?'selected':''}" onclick="pickService('${s.id}')"><b>${s.name}</b><span>${s.duration} min · ${money(s.price)}</span></button>`).join('')}</div>`;
 if(f.step===2) root.innerHTML=`<div class="eyebrow" style="color:#785f00">Passo 2</div><h2 style="margin:8px 0 18px">Com quem você prefere?</h2><div class="choiceGrid">${profs.map(p=>`<button class="choice ${f.prof===p.name?'selected':''}" onclick="pickProf('${p.name}')"><b>${p.name}</b><span>${p.role}</span></button>`).join('')}<button class="choice" onclick="pickProf('Qualquer profissional')"><b>Sem preferência</b><span>Primeiro horário disponível</span></button></div><div class="bookingFooter"><button class="btn btn-ghost" style="color:#333;border-color:#ddd" onclick="bookBack()">Voltar</button></div>`;
 if(f.step===3){const dates=nextDays(10);root.innerHTML=`<div class="eyebrow" style="color:#785f00">Passo 3</div><h2 style="margin:8px 0 18px">Escolha o melhor horário</h2><div class="dateRow">${dates.map(d=>`<button class="dateChip ${f.date===d.iso?'selected':''}" onclick="pickDate('${d.iso}')"><b>${d.day}</b><br>${d.label}</button>`).join('')}</div><div class="times">${availableTimes().map(t=>`<button class="timeChip ${f.time===t?'selected':''}" onclick="pickTime('${t}')">${t}</button>`).join('')}</div><div class="bookingFooter"><button class="btn btn-ghost" style="color:#333;border-color:#ddd" onclick="bookBack()">Voltar</button></div>`}
 if(f.step===4) root.innerHTML=`<div class="eyebrow" style="color:#785f00">Último passo</div><h2 style="margin:8px 0 18px">Seus dados</h2><form onsubmit="finishBooking(event)"><div class="fieldGrid"><div class="field full"><label>Seu nome</label><input id="bkName" required placeholder="Nome completo"></div><div class="field full"><label>WhatsApp</label><input id="bkPhone" required placeholder="(21) 99999-9999"></div><div class="field full"><label>Observação (opcional)</label><textarea id="bkObs" rows="3" placeholder="Algo que o profissional precisa saber?"></textarea></div></div><div class="bookingFooter"><button type="button" class="btn btn-ghost" style="color:#333;border-color:#ddd" onclick="bookBack()">Voltar</button><button class="btn btn-dark">Confirmar agendamento</button></div></form>`;
 updateSummary();
}
function pickService(id){window.bookFlow.service=state.services.find(s=>s.id===id);window.bookFlow.step=2;renderBookStep()}function pickProf(n){window.bookFlow.prof=n;window.bookFlow.step=3;renderBookStep()}function pickDate(d){window.bookFlow.date=d;window.bookFlow.time=null;renderBookStep()}function pickTime(t){window.bookFlow.time=t;window.bookFlow.step=4;renderBookStep()}function bookBack(){window.bookFlow.step=Math.max(1,window.bookFlow.step-1);renderBookStep()}
function nextDays(n){n=Math.min(n||10,state.business.bookingWindowDays||30);const out=[];for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()+i);out.push({iso:d.toISOString().slice(0,10),day:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''),label:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})})}return out}
function availableTimes(){if(!window.bookFlow.date)return ['09:00','09:40','10:20','11:00','13:00','13:40','14:20','15:00','16:20','17:00','18:00'];const booked=state.bookings.filter(b=>b.date===window.bookFlow.date).map(b=>b.time);return ['09:00','09:40','10:20','11:00','11:40','13:00','13:40','14:20','15:00','15:40','16:20','17:00','17:40','18:20'].filter(t=>!booked.includes(t))}
function updateSummary(){const f=window.bookFlow,s=$('#bookSummary');if(!s)return;if(!f.service)return s.innerHTML='<div class="empty">Escolha um serviço para começar.</div>';s.innerHTML=`<div class="summaryLine"><span>Serviço</span><b>${f.service.name}</b></div><div class="summaryLine"><span>Profissional</span><b>${f.prof||'—'}</b></div><div class="summaryLine"><span>Data</span><b>${f.date?fmtDate(f.date):'—'}</b></div><div class="summaryLine"><span>Horário</span><b>${f.time||'—'}</b></div><div class="summaryLine"><span>Valor</span><b>${money(f.service.price)}</b></div>`}
function finishBooking(e){e.preventDefault();const f=window.bookFlow,name=$('#bkName').value,phone=$('#bkPhone').value.replace(/\D/g,'');state.bookings.push({id:uid(),date:f.date,time:f.time,client:name,phone,service:f.service.name,price:f.service.price,professional:f.prof==='Qualquer profissional'?state.professionals[0].name:f.prof,status:'pendente'});upsertClient(name,phone,0,f.date);save();if(state.business.notifications&&Notification?.permission==='granted')new Notification('Novo agendamento',{body:`${name} · ${f.service.name} · ${f.time}`});const addUrl=googleCalUrl(f,name);app().innerHTML=`<div class="bookingPage" style="display:grid;place-items:center;padding:24px"><div class="bookCard" style="max-width:560px;text-align:center"><div style="font-size:54px">✓</div><h1 style="font-family:Manrope">Agendamento solicitado!</h1><p class="muted">${name}, seu horário foi registrado para <b>${fmtDate(f.date)} às ${f.time}</b>. O estabelecimento pode confirmar pelo WhatsApp.</p><div style="display:grid;gap:9px;margin-top:20px"><a class="btn btn-dark" target="_blank" href="${addUrl}">Adicionar ao Google Agenda</a><button class="btn btn-primary" onclick="openWhats('${state.business.whatsapp}')">Falar no WhatsApp</button><button class="btn btn-ghost" style="color:#333;border-color:#ddd" onclick="navigate('#booking/${state.business.slug}')">Novo agendamento</button></div></div></div>`}
function googleCalUrl(f,name){const start=(f.date.replaceAll('-','')+'T'+f.time.replace(':','')+'00'),endDate=new Date(`${f.date}T${f.time}:00`);endDate.setMinutes(endDate.getMinutes()+f.service.duration);const end=endDate.toISOString().replace(/[-:]/g,'').slice(0,15);return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(f.service.name+' - '+state.business.name)}&dates=${start}/${end}&details=${encodeURIComponent('Agendamento de '+name)}&location=${encodeURIComponent(state.business.address)}`}
function upsertClient(name,phone,value,date){let c=state.clients.find(x=>x.phone.replace(/\D/g,'')===phone.replace(/\D/g,''));if(c){c.visits++;c.total+=Number(value||0);c.last=date}else state.clients.push({id:uid(),name,phone,visits:1,total:Number(value||0),last:date})}

function renderOwner(){
 const tenants=[{name:state.business.name,niche:state.business.niche,plan:state.plan,status:'Ativo',mrr:state.plan==='Básico'?19.9:39.9,clients:state.clients.length},{name:'Studio Bella',niche:'Manicure',plan:'Pro',status:'Ativo',mrr:39.9,clients:86},{name:'PodoCare',niche:'Podologia',plan:'Básico',status:'Ativo',mrr:19.9,clients:42},{name:'Espaço Lumina',niche:'Estética',plan:'Pro',status:'Teste',mrr:0,clients:18}];
 const mrr=tenants.reduce((a,t)=>a+t.mrr,0);
 app().innerHTML=shell('owner',`<div class="pageHead"><div><h1>Painel do dono</h1><p>Visão geral dos assinantes da plataforma.</p></div><button class="btn btn-primary" onclick="toast('Fluxo de convite preparado para a próxima etapa')">+ Novo assinante</button></div><div class="cards"><div class="metric"><div class="label">Assinantes</div><div class="value">${tenants.length}</div><div class="trend">3 ativos + 1 teste</div></div><div class="metric"><div class="label">MRR estimado</div><div class="value">${money(mrr)}</div><div class="trend">receita recorrente mensal</div></div><div class="metric"><div class="label">Plano Pro</div><div class="value">${tenants.filter(t=>t.plan==='Pro').length}</div><div class="trend">potencial de upsell</div></div><div class="metric"><div class="label">Clientes finais</div><div class="value">${tenants.reduce((a,t)=>a+t.clients,0)}</div><div class="trend">na base dos assinantes</div></div></div><div class="tableWrap" style="margin-top:16px"><table class="table"><thead><tr><th>Assinante</th><th>Nicho</th><th>Plano</th><th>Status</th><th>Clientes</th><th>Mensalidade</th><th></th></tr></thead><tbody>${tenants.map(t=>`<tr><td><b>${t.name}</b></td><td>${t.niche}</td><td>${t.plan}</td><td><span class="tag ${t.status==='Teste'?'warn':''}">${t.status}</span></td><td>${t.clients}</td><td>${money(t.mrr)}</td><td><button class="iconBtn">Gerenciar</button></td></tr>`).join('')}</tbody></table></div>`, 'Administração da plataforma');
 // owner is not in normal subscriber menu; add visual indicator only
}

function renderOnboarding(){
 const niches=[['💈','Barbearia'],['💅','Manicure'],['✨','Estética'],['🦶','Podologia'],['💇','Cabeleireiro'],['💆','Massoterapia'],['🏋️','Personal Trainer'],['＋','Outro']];
 app().innerHTML=`<div class="authPage"><div class="authVisual"><div class="brand"><span class="brandmark">AX</span>AgendaX</div><div><div class="eyebrow">Configuração inicial</div><h1>Seu sistema pronto em poucos minutos.</h1><p>Escolha seu tipo de negócio, coloque sua marca e defina os serviços. A página pública nasce automaticamente.</p></div><div class="small muted">Você pode mudar tudo depois.</div></div><div class="authFormWrap"><div class="authForm" style="width:min(680px,100%)"><h2>Qual é o seu negócio?</h2><div class="lead">Isso ajusta os textos e sugestões do sistema.</div><div class="onboardGrid">${niches.map(([i,n])=>`<button class="nicheCard" onclick="selectNiche(this,'${n}')"><div class="nicheIcon">${i}</div><b>${n}</b></button>`).join('')}</div><button class="btn btn-primary" style="width:100%;margin-top:20px" onclick="finishOnboarding()">Continuar</button></div></div></div>`}
function selectNiche(el,n){$$('.nicheCard').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');state.business.niche=n}
function finishOnboarding(){state.onboardingDone=true;save();navigate('#app/aparencia')}

</script>
</body>
</html>
